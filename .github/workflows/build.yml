name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish win-x64 single-file executable
        shell: pwsh
        run: >-
          dotnet publish src/KeychronMicMute/KeychronMicMute.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o dist
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: KeychronMicMute-win-x64
          path: dist/KeychronMicMute.exe
          if-no-files-found: error
          retention-days: 30
